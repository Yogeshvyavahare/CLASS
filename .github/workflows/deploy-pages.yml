name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages content
        run: |
          mkdir -p public
          # Use the mockup HTML as the site index
          cp -f Vivines_Learning_Platform_Mockup.html public/index.html
          # If you have assets folder, copy it too (non-fatal if missing)
          cp -r assets public/ || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v2

      - name: Upload artifact for deployment
        uses: actions/upload-pages-artifact@v1
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
